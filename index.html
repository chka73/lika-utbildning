<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lika Utbildning AB</title>
<meta name="description" content="Lika Utbildning AB hjälper skolor och verksamheter att förebygga utsatthet på internet - med fokus på barn och vuxna med eftersläpande färdigheter." />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  a { text-decoration: none; }
  input, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const EARTH = {
  bg: "#f5f0e8",
  card: "#faf6ef",
  dark: "#3e3630",
  clay: "#8a5a44",
  moss: "#6b7150",
  sand: "#d9c9a8",
  text: "#4a4238",
  light: "#efe6d5",
};

const services = [
  {
    title: "Föreläsningar",
    desc: "Researchbaserade och praktiska föreläsningar om att förebygga utsatthet på nätet - anpassade för skolor, föräldrar, SFO och kommuner.",
    points: ["Vad gör barn och unga på nätet - och var finns riskerna", "Nätmobbing, grooming och kränkningar: tecken och tidiga signaler", "Konkreta verktyg för vuxna i barnets närhet"],
  },
  {
    title: "Workshops",
    desc: "Interaktiva workshops för arbetslag eller hela personalstyrkor, där teori blir till gemensamma rutiner och handlingsplaner.",
    points: ["För arbetslag, EHT och hela personalstyrkor", "Praktiska fallövningar utifrån er verksamhet", "Utformning av handlingsplaner och rutiner"],
  },
  {
    title: "Arbetsmaterial",
    desc: "Färdigt, lättanvänt material som gör arbetet levande långt efter föreläsningen - för elever, vårdnadshavare och personal.",
    points: ["Lektionsmaterial och elevaktiviteter", "Material för utvecklingssamtal och föräldramöten", "Checklistor och stödmateriel för personal"],
  },
];

const people = [
  {
    name: "Maria Karlsson",
    initials: "MK",
    role: "Biträdande rektor åk F-3, Ekebyhovsskolan, Ekerö",
    bio: "Tidigare föreläsare för Säkra Varje Unge. Lång erfarenhet av att arbeta med yngre barns trygghet på nätet och av att stötta vuxna kring dem.",
  },
  {
    name: "Sylvia Lindfors",
    initials: "SL",
    role: "Biträdande rektor, anpassad grundskola, Ljungenskolan, Vellinge",
    bio: "Specialist på barn och vuxna med eftersläpande färdigheter - och på att anpassa det förebyggande arbetet så att det når alla.",
  },
];

function Section({ children, bg, id }) {
  return (
    <section id={id} style={{ backgroundColor: bg, padding: "72px 24px" }}>
      <div style={{ maxWidth: 1080, margin: "0 auto" }}>{children}</div>
    </section>
  );
}

function Avatar({ initials }) {
  return (
    <div
      style={{
        width: 220,
        height: 220,
        borderRadius: "50%",
        background: `linear-gradient(135deg, ${EARTH.clay}, ${EARTH.moss})`,
        color: "#faf6ef",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontSize: 64,
        fontWeight: 600,
        letterSpacing: 2,
        fontFamily: "Georgia, serif",
        margin: "0 auto",
        boxShadow: "0 6px 24px rgba(62,54,48,0.25)",
        border: `6px solid ${EARTH.sand}`,
      }}
    >
      {initials}
    </div>
  );
}

function Nav({ onNav }) {
  const links = [
    ["om-oss", "Om oss"],
    ["tjanster", "Tjänster"],
    ["kontakt", "Kontakt"],
  ];
  return (
    <nav
      style={{
        position: "sticky",
        top: 0,
        zIndex: 50,
        backgroundColor: EARTH.dark,
        color: "#faf6ef",
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        padding: "16px 32px",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => onNav("top")}>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d9c9a8" strokeWidth="1.8">
          <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z" />
          <path d="M9 12l2 2 4-4" />
        </svg>
        <span style={{ fontFamily: "Georgia, serif", fontSize: 19, letterSpacing: 0.5 }}>Lika Utbildning AB</span>
      </div>
      <div style={{ display: "flex", gap: 28 }}>
        {links.map(([id, label]) => (
          <a
            key={id}
            href={`#${id}`}
            style={{ color: "#e5dcc9", textDecoration: "none", fontSize: 15 }}
            onMouseOver={(e) => (e.currentTarget.style.color = "#d9c9a8")}
            onMouseOut={(e) => (e.currentTarget.style.color = "#e5dcc9")}
          >
            {label}
          </a>
        ))}
      </div>
    </nav>
  );
}

function App() {
  const [form, setForm] = useState({ name: "", email: "", message: "" });
  const [sent, setSent] = useState(false);

  const inputStyle = {
    width: "100%",
    padding: "12px 14px",
    borderRadius: 8,
    border: `1px solid ${EARTH.sand}`,
    backgroundColor: "#fffdf8",
    color: EARTH.text,
    fontSize: 15,
    outline: "none",
    boxSizing: "border-box",
  };

  return (
    <div style={{ backgroundColor: EARTH.bg, color: EARTH.text, fontFamily: "'Segoe UI', system-ui, sans-serif", margin: 0 }}>
      <Nav onNav={(id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" })} />

      {/* Hero */}
      <section id="top" style={{ padding: "96px 24px 88px", textAlign: "center", background: `linear-gradient(180deg, ${EARTH.light}, ${EARTH.bg})` }}>
        <div style={{ maxWidth: 820, margin: "0 auto" }}>
          <div style={{ color: EARTH.clay, fontWeight: 600, letterSpacing: 3, textTransform: "uppercase", fontSize: 13, marginBottom: 16 }}>
            Förebyggande arbete &amp; Skolor &amp; verksamheter
          </div>
          <h1 style={{ fontFamily: "Georgia, serif", fontSize: 46, color: EARTH.dark, margin: "0 0 20px", lineHeight: 1.2 }}>
            Alla har rätt att känna sig trygga på nätet
          </h1>
          <p style={{ fontSize: 19, lineHeight: 1.7, color: EARTH.text, margin: "0 auto 36px", maxWidth: 640 }}>
            Vi hjälper skolor och verksamheter att förebygga utsatthet på internet - med särskilt fokus på barn
            och vuxna med eftersläpande färdigheter. Med forskning, praktisk erfarenhet och konkreta verktyg.
          </p>
          <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap" }}>
            <a href="#tjanster" style={{ backgroundColor: EARTH.clay, color: "#faf6ef", padding: "14px 32px", borderRadius: 8, textDecoration: "none", fontWeight: 600, fontSize: 16, display: "inline-block" }}>
              Se våra tjänster
            </a>
            <a href="#kontakt" style={{ backgroundColor: "transparent", color: EARTH.dark, padding: "14px 32px", borderRadius: 8, textDecoration: "none", fontWeight: 600, fontSize: 16, border: `2px solid ${EARTH.clay}`, display: "inline-block" }}>
              Kontakta oss
            </a>
          </div>
        </div>
      </section>

      {/* Om oss */}
      <Section id="om-oss" bg={EARTH.bg}>
        <h2 style={{ fontFamily: "Georgia, serif", fontSize: 34, color: EARTH.dark, textAlign: "center", marginBottom: 12 }}>Om oss</h2>
        <p style={{ textAlign: "center", color: EARTH.clay, fontSize: 16, marginBottom: 48 }}>Två rektorer, en gemensam drivkraft: trygghet för alla barn och vuxna.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 32 }}>
          {people.map((p) => (
            <div key={p.name} style={{ backgroundColor: EARTH.card, borderRadius: 16, padding: 36, textAlign: "center", boxShadow: "0 4px 18px rgba(62,54,48,0.10)", borderTop: `4px solid ${EARTH.clay}` }}>
              <Avatar initials={p.initials} />
              <h3 style={{ fontFamily: "Georgia, serif", fontSize: 24, color: EARTH.dark, margin: "22px 0 6px" }}>{p.name}</h3>
              <div style={{ color: EARTH.clay, fontSize: 14, fontWeight: 600, marginBottom: 14 }}>{p.role}</div>
              <p style={{ fontSize: 15, lineHeight: 1.7 }}>{p.bio}</p>
            </div>
          ))}
        </div>
      </Section>

      {/* Tjänster */}
      <Section id="tjanster" bg={EARTH.light}>
        <h2 style={{ fontFamily: "Georgia, serif", fontSize: 34, color: EARTH.dark, textAlign: "center", marginBottom: 12 }}>Våra tjänster</h2>
        <p style={{ textAlign: "center", fontSize: 16, marginBottom: 48, color: EARTH.clay }}>Anpassade efter er verksamhet - från föreläsning till långsiktigt material.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 28 }}>
          {services.map((s, i) => (
            <div key={s.title} style={{ backgroundColor: "#fffdf8", borderRadius: 16, padding: 32, boxShadow: "0 4px 18px rgba(62,54,48,0.08)", borderTop: `4px solid ${i === 1 ? EARTH.moss : EARTH.clay}` }}>
              <div style={{ fontSize: 13, color: EARTH.moss, fontWeight: 700, letterSpacing: 2, marginBottom: 8 }}>0{i + 1}</div>
              <h3 style={{ fontFamily: "Georgia, serif", fontSize: 23, color: EARTH.dark, margin: "0 0 12px" }}>{s.title}</h3>
              <p style={{ fontSize: 15, lineHeight: 1.7, marginBottom: 16 }}>{s.desc}</p>
              <ul style={{ listStyle: "none", padding: 0, margin: 0, fontSize: 14, lineHeight: 1.6 }}>
                {s.points.map((pt) => (
                  <li key={pt} style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "flex-start" }}>
                    <span style={{ color: EARTH.moss, fontWeight: 700 }}>-</span> {pt}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      </Section>

      {/* Kontakt */}
      <Section id="kontakt" bg={EARTH.bg}>
        <h2 style={{ fontFamily: "Georgia, serif", fontSize: 34, color: EARTH.dark, textAlign: "center", marginBottom: 12 }}>Kontakt</h2>
        <p style={{ textAlign: "center", fontSize: 16, color: EARTH.clay, marginBottom: 40 }}>
          Skriv till oss - vi återkommer med förslag på upplägg och pris.
        </p>
        <div style={{ maxWidth: 560, margin: "0 auto", backgroundColor: EARTH.card, borderRadius: 16, padding: 36, boxShadow: "0 4px 18px rgba(62,54,48,0.10)" }}>
          {sent ? (
            <div style={{ textAlign: "center", padding: 32 }}>
              <div style={{ fontSize: 44, marginBottom: 12 }}>-ï¸</div>
              <h3 style={{ fontFamily: "Georgia, serif", color: EARTH.dark, margin: "0 0 8px" }}>Tack för ditt meddelande!</h3>
              <p style={{ fontSize: 15 }}>Vi hör av oss så snart vi kan.</p>
            </div>
          ) : (
            <form
              onSubmit={(e) => {
                e.preventDefault();
                setSent(true);
              }}
              style={{ display: "grid", gap: 16 }}
            >
              <input style={inputStyle} placeholder="Namn" required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
              <input style={inputStyle} type="email" placeholder="E-post" required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
              <textarea style={{ ...inputStyle, minHeight: 120, resize: "vertical" }} placeholder="Berätta kort vad ni behöver hjälp med-¦" required value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })} />
              <button type="submit" style={{ backgroundColor: EARTH.clay, color: "#faf6ef", border: "none", padding: "14px 24px", borderRadius: 8, fontSize: 16, fontWeight: 600, cursor: "pointer" }}>
                Skicka förfrågan
              </button>
            </form>
          )}
        </div>
      </Section>

      <footer style={{ backgroundColor: EARTH.dark, color: "#c9bda8", padding: "32px 24px", textAlign: "center", fontSize: 14 }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 17, color: "#e5dcc9", marginBottom: 6 }}>Lika Utbildning AB</div>
        <div>Förebyggande arbete mot utsatthet på internet - Drivs av Maria Karlsson &amp; Sylvia Lindfors</div>
      </footer>
    </div>
  );
}
</script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
